work:
  - position: PhD Researcher
    company_name: "TU Wien – Institute of Materials Chemistry"
    company_url: "https://www.tuwien.at"
    start: '2023-07-12'
    summary: |
      - Developing machine-learning interatomic potentials (NEP, Allegro, MACE) with active learning, validated on phonons and heat transport rather than energy and force errors alone
      - Symmetry-based methods for quasi-1D materials: line groups, irreducible representations and symmetry-resolved modal analysis of heat transport
      - Thermal transport from DFT (VASP), GPU-accelerated MD (GPUMD), Green–Kubo and atomistic Green's functions
      - Lead developer of [pulgon_tools](https://github.com/pulgon-project/pulgon_tools), an open-source package for line-group symmetry analysis
  - position: Graduate Researcher
    company_name: South China University of Technology
    company_url: "https://www.scut.edu.cn"
    start: '2020-09-01'
    end: '2023-07-01'
    summary: |
      - Developed a symmetry-based classification scheme to determine ground-state configurations of binary and ternary alloys
      - Combined symmetry enumeration with DFT calculations using VASP to reduce the cost of alloy ground-state searches
      - Applied the method to multi-component alloy systems, enabling efficient screening beyond exhaustive configuration sampling

